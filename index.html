function legalView(){var L2=[["À faire valider","Ces textes sont des modèles pour la version d’essai. Avant le lancement, ils doivent être relus par un juriste."],["Éditeur et hébergeur","[À compléter : nom ou raison sociale, adresse, e-mail de contact, hébergeur de l’app.] Ces mentions sont obligatoires en France."],["Conditions d’utilisation","Le Coin est un service d’information gratuit, réservé à un usage personnel. Les horaires, prix et coordonnées sont communiqués par les commerçants ou issus de données ouvertes : ils sont indicatifs et peuvent changer, vérifiez auprès du commerce. Le Coin ne peut pas garantir qu’ils soient exacts à tout moment."],["Confidentialité","Le Coin n’enregistre aucune donnée sur vous : pas de compte, pas de cookie, pas de traceur, pas de publicité ciblée. Tout ce que vous faites disparaît quand vous fermez l’app. Comme sur tout site, l’hébergeur peut conserver brièvement des journaux techniques de sécurité [à préciser avec l’hébergeur]."],["Assistant (intelligence artificielle)","Vous échangez avec une IA : ses réponses peuvent contenir des erreurs et ne remplacent pas un conseil médical, juridique ou financier. Les textes que vous lui écrivez lui sont envoyés pour obtenir une réponse : n’y mettez pas d’informations personnelles ou sensibles."],["Vos droits","Vous disposez des droits d’accès, de rectification, d’effacement et d’opposition prévus par le RGPD. Comme rien n’est enregistré, il n’y a rien à effacer côté Le Coin. Contact : [à compléter]. Vous pouvez aussi saisir la CNIL."],["Sources des données","Horaires de tram et de bus en direct : TBM / Bordeaux Métropole, Licence Ouverte (source et heure de mise à jour affichées dans l’app). Les autres données (prix, horaires des commerces, restaurants, carburants, parkings) sont des exemples dans cette version. Lieux de santé, stations de taxis et parkings : © contributeurs OpenStreetMap (licence ODbL), données parfois incomplètes ou périmées : vérifiez sur place ou par téléphone."],["Services tiers","Pour afficher les horaires en direct, votre navigateur contacte les serveurs de TBM / Bordeaux Métropole ; pour afficher la carte et les lieux de santé, il contacte OpenStreetMap et son service de données (Overpass). Ces services voient donc votre adresse IP, comme tout site visité. Le Coin lui-même n’enregistre rien. L’hébergeur de la page peut tenir des journaux techniques [à préciser]."],["Informations des commerçants","Elles sont fournies et certifiées par les commerçants eux-mêmes, qui peuvent les modifier ou les retirer à tout moment via l’Espace commerçant."],["Publicités","Les publicités sont toujours signalées « Publicité locale »."],["Alcool","L’abus d’alcool est dangereux pour la santé, à consommer avec modération. Les rubriques liées à l’alcool sont réservées aux personnes majeures."],["Géolocalisation","Si vous touchez « Autour de moi » dans Santé, votre navigateur demande l’autorisation d’utiliser votre position. Elle sert uniquement à centrer la carte et n’est ni enregistrée ni conservée par Le Coin ; la zone recherchée est transmise au service de données de la carte."]];return banner("Informations légales","Conditions, confidentialité et sources","",1)+L2.map(function(x){return `<div class="c"><b>${x[0]}</b><div class="meta" style="margin-top:6px">${x[1]}</div></div>`}).join("")}
